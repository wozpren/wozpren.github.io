<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- 确保移动端不缩放，保持最佳全屏体验 -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity Web Player | cgame2</title>
    <style>
      /* 重置默认边距，并强制 html 和 body 占满全屏，隐藏滚动条 */
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #231F20;
      }
      /* 让 Canvas 强行填满父容器（即屏幕） */
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- 移除了硬编码的 width="960" height="600" 和内联样式 -->
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <script src="Build/Game2.loader.js"></script>
    <script>
      // 统一直接创建 Unity 实例，不再区分移动端和 PC 端，因为 CSS 已经实现了全屏
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/Game2.data.unityweb",
        frameworkUrl: "Build/Game2.framework.js.unityweb",
        codeUrl: "Build/Game2.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "wozpren",
        productName: "cgame2",
        productVersion: "1.0",
        // matchWebGLToCanvasSize: true, // 默认就是 true，Unity会自动将分辨率匹配Canvas大小
        // devicePixelRatio: 1, 
      }).then((unityInstance) => {
        // 游戏加载完成后的回调
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
